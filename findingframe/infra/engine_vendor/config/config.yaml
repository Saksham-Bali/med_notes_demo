# Configuration
llm:
  provider: "openrouter"
  model: "openai/gpt-5.5"
  max_tokens: 4000
  temperature: 0.0

judge:
  provider: "openrouter"
  model: "anthropic/claude-sonnet-4"
  max_tokens: 2000
  temperature: 0.0

routine:
  provider: "openrouter"
  model: "google/gemini-2.5-pro"
  max_tokens: 2000
  temperature: 0.0

data:
  raw_path: "./data/raw"
  processed_path: "./data/processed"
  output_path: "./outputs"

processing:
  batch_size: 10
  save_intermediate: true
  max_patients: 20  # For development, limit patient count
  use_hybrid_extraction: true  # Rule+LLM hybrid (reduces LLM cost)
  use_vector_grounding: true   # BiomedBERT+FAISS grounding tier
  use_paired_extraction: false # Paired report extraction for temporal consistency (+0.06 F1)

logging:
  level: "INFO"
  file: "./logs/processing.log"
